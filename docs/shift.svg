<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 488" width="880" height="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="As the applicant mix shifts toward the lowest-income band, a single global threshold goes from 0.7% to 98% of trials violating, while the bound it reports stays at 0.175 throughout. One threshold per band never leaves 0.7%.">

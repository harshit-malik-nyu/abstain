<line class="grid" x1="66" y1="56.0" x2="588" y2="56.0" stroke="#d8dee4" stroke-width="1"/>
<text class="ax" x="56" y="59.5" fill="#656d76" text-anchor="end">100%</text>
<text class="ax" x="140.6" y="396" fill="#656d76" text-anchor="middle">14%</text>

<text class="lbl" x="604" y="66.4" fill="#d6453d">one global threshold</text>
<text class="note" x="604" y="82.4" fill="#656d76"><tspan font-weight="600">0.7%</tspan> of trials violate at the mix</text>
<text class="note" x="604" y="96.4" fill="#656d76">it was calibrated on, <tspan font-weight="600">98%</tspan> at the far end</text>
<text class="lbl" x="604" y="314.0" fill="#b07d12">the bound it reported</text>
<text class="note" x="604" y="330.0" fill="#656d76"><tspan font-weight="600">0.175</tspan> at every point. It is computed</text>
<text class="note" x="604" y="344.0" fill="#656d76">on calibration data, which never</text>
<text class="note" x="604" y="358.0" fill="#656d76">shifted, so an operator watching</text>
<text class="note" x="604" y="372.0" fill="#656d76">it sees nothing wrong.</text>
<text class="lbl" x="604" y="398.0" fill="#0f8a84">one threshold per band</text>
<text class="note" x="604" y="414.0" fill="#656d76">never leaves <tspan font-weight="600">0.7%</tspan>. Re-weighting groups</text>
<text class="note" x="604" y="428.0" fill="#656d76">calibrated separately changes</text>
<text class="note" x="604" y="442.0" fill="#656d76">which thresholds are used, not</text>
<text class="note" x="604" y="456.0" fill="#656d76">what any one of them is.</text>
<text class="note" x="66" y="478.0023334602339" fill="#656d76">evidence/round5_shift.json · scripts/make_figure.py</text>

name: build-cases
on:
  push:
    branches: [main]
    paths: ['scripts/build_cases.py', '.build-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install policyengine-us
      - run: |
          mkdir -p evidence
          python scripts/build_cases.py 2>&1 | tee evidence/build-run.txt
      - name: Split
        run: python scripts/split.py 2>&1 | tee -a evidence/build-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Case generation'; echo; echo '```';
            tail -20 evidence/build-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: cases generated and split [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }

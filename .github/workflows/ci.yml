name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Full history: the discipline tests read commit dates to check that
      # the pre-registration predates the script that opens the holdout.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src/abstain tests scripts
      # 90, not 70. The floor was 70 while the suite sat at 96, which is a
      # floor that cannot catch anything: shift.py -- the module behind the
      # most dramatic result here -- was at 0% and CI was green, because the
      # evidence-coupling tests compare prose to a JSON file and would pass
      # unchanged if a refactor broke the harness underneath it.
      - run: pytest -q --cov=abstain --cov-report=term --cov-fail-under=90
